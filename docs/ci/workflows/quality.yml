name: Quality Gate

# Wiederverwendbarer Qualitäts-Workflow.
#
# Diese Datei ist die EINZIGE Stelle, an der Typecheck, Tests und Build
# definiert werden. `ci.yml` (Pull Requests) und `deploy.yml` (GitHub Pages)
# rufen sie über `workflow_call` auf. Dadurch kann ein Deploy nicht mit einer
# anderen (schwächeren) Prüfung laufen als ein Pull Request.
#
# Regeln (AGENTS.md K6):
#   - `npm ci` mit vorhandenem Lockfile, KEIN Fallback auf `npm install`,
#     kein Löschen von package-lock.json.
#   - Node-Version kommt aus `.nvmrc`.
#   - Minimale Berechtigungen: nur Lesezugriff auf den Inhalt.

on:
  workflow_call:
    inputs:
      upload-build:
        description: "Build-Ausgabe (./out) als Artefakt hochladen"
        required: false
        default: false
        type: boolean
    outputs:
      artifact-size:
        description: "Größe des Static Exports"
        value: ${{ jobs.quality.outputs.artifact-size }}

# Minimaler Berechtigungsumfang für den gesamten Workflow.
permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Typecheck, Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact-size: ${{ steps.size.outputs.size }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node (Version aus .nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Next.js-Build-Cache wiederherstellen
        # Derselbe Schlüssel wie im Pages-Build-Job (`deploy.yml`). Ohne ihn baute
        # dieses Gate jeden Static Export komplett neu, obwohl derselbe Commit im
        # selben Run kurz darauf noch einmal gebaut wird.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.css', '**/*.mjs', 'postcss.config.js') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Lockfile vorhanden?
        # `npm ci` ohne Lockfile wäre ein stiller Fallback auf ein
        # unreproduzierbares Abhängigkeits-Set. Lieber sofort scheitern.
        run: |
          test -f package-lock.json || {
            echo "::error file=package-lock.json::package-lock.json fehlt - reproduzierbare Installation nicht möglich"
            exit 1
          }

      - name: Install (reproduzierbar)
        # Bewusst ohne Retry-/Fallback-Logik: schlägt `npm ci` fehl, ist das
        # Lockfile kaputt oder die Registry nicht erreichbar. Beides muss
        # sichtbar scheitern statt heimlich ein anderes Ergebnis zu bauen.
        run: npm ci

      - name: Lockfile unverändert?
        # `npm ci` darf package-lock.json niemals anfassen. Tut es das doch,
        # war das Lockfile nicht synchron zu package.json.
        run: git diff --exit-code -- package-lock.json package.json

      - name: Lockfile-Gate bewiesen? (AGENTS.md K6)
        # Der Schritt oben prüft nur das Ergebnis. Dieses Skript beweist, dass
        # die Prüfung überhaupt greift: Es erzeugt eine desynchronisierte Kopie
        # und verlangt, dass `npm ci` daran scheitert. Ohne diesen Schritt wäre
        # ein wirkungsloses Gate unsichtbar.
        run: npm run ci:verify-lockfile-gate

      - name: Deploy-Trigger passt noch? (AUDIT T7)
        # `deploy.yml` kann in `on.push.branches` keinen Ausdruck auswerten und
        # trägt deshalb den Default-Branch als Handarbeit. Wird der Branch
        # umbenannt, feuert der Deploy nicht mehr — ohne Fehler, ohne Run.
        # Dieser Wächter rotet stattdessen. Er läuft hier (PR und Deploy), weil
        # ein Gate, das nicht läuft, grüner aussieht als eines, das scheitert.
        env:
          EXPECTED_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: npm run ci:verify-deploy-trigger

      - name: Lint
        # Muss im Gate stehen (nicht nur lokal): Ein ungenutzter Import ist
        # auf die Base gemergt worden, weil nur typecheck/test geprüft wurden.
        run: npm run lint

      - name: Format-Check
        run: npm run format:check

      - name: Typecheck (Produktionscode)
        run: npm run typecheck

      - name: Typecheck (inklusive Tests)
        # Ohne diesen Schritt gälten die typsicheren Einheiten nur im
        # Produktionscode — Tests könnten Ampere und Volt vertauschen.
        run: npm run typecheck:tests

      - name: Unit- und Komponententests (mit Coverage-Gate für lib/**)
        # Testlauf inkl. Coverage: unterschreitet der Engine-Kern (lib/**)
        # die Schwellen aus vitest.config.ts, scheitert das Gate hier.
        run: npm run test:coverage

      - name: Perf-Gate Kanten-Routing (WP-11 / #400)
        # Harter Budget-Check: Median ≤ 16 ms Main-Thread pro Frame am
        # 100+-Kanten-Referenzplan (Begründung: docs/adr/0012-perf-budget-16ms-pro-frame.md).
        # Überschreitung ⇒ Exit-Code 1 ⇒ Gate rot.
        run: npm run perf:edge-routing

      - name: Routing-Audit I1–I7 über alle Referenzpläne
        # AGENTS.md §3.7 verlangt `routing:audit` vor jeder Routing-Änderung,
        # aber verlangt wurde es bisher nur lokal — das Skript setzt bei
        # I1-Verletzung, Nicht-Orthogonalität, Fallbacks oder nicht
        # identischem Doppellauf Exit-Code 1. Damit gehört die Forderung zum
        # Gate statt zur Goodwill-Liste.
        run: npm run routing:audit

      - name: Build (Static Export)
        run: npm run build

      - name: Static Export vorhanden?
        run: |
          test -f ./out/index.html || {
            echo "::error::Static Export unvollständig - ./out/index.html fehlt"
            exit 1
          }

      - name: Artefaktgröße messen
        id: size
        run: |
          SIZE=$(du -sh ./out | cut -f1)
          PAGES=$(find ./out -name "index.html" | wc -l | tr -d ' ')
          echo "size=${SIZE}" >> "$GITHUB_OUTPUT"
          {
            echo "## Quality Gate"
            echo ""
            echo "| Metrik | Wert |"
            echo "|--------|------|"
            echo "| Node | \`$(node -v)\` |"
            echo "| Static Export | ${SIZE} |"
            echo "| HTML-Seiten | ${PAGES} |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build-Ausgabe hochladen
        if: ${{ inputs.upload-build }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-export
          path: ./out
          retention-days: 7

  # ── End-to-End gegen den gebauten Static Export ─────────────────────────────
  e2e:
    name: End-to-End (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node (Version aus .nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (reproduzierbar)
        run: npm ci

      - name: Playwright-Browser installieren
        # Nur Chromium: die Suite prüft Anwendungsverhalten, keine
        # Browser-Unterschiede. Das hält die Laufzeit des Gates niedrig.
        run: npx playwright install --with-deps chromium

      - name: Build (Static Export)
        run: npm run build

      - name: E2E-Tests
        # Blockierend sind ausschließlich die funktionalen Szenarien. Der
        # Pixel-Vergleich läuft im Job `visual` — derselbe Build, dieselben
        # Browser, aber ohne Deploy-Macht.
        # Begründung: Ein einzelner Baseline-Diff hat am 25.09.2026 den
        # Production-Deploy für 16 Tage gestoppt, weil `deploy.yml` an diesem
        # Job hängt. Funktionalität und Pixelgenauigkeit haben nicht dieselbe
        # Schwere und dürfen nicht dieselbe Wirkung haben.
        run: npx playwright test --grep-invert "hält die Baseline"

      - name: Report hochladen
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # ── Visuelles Gate: melden, nicht blockieren ────────────────────────────────
  visual:
    name: Visuelles Gate (nicht blockierend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Bewusst kein `needs`: dieser Job startet parallel zum funktionalen E2E und
    # darf den Workflow nie rot machen. `continue-on-error` macht einen Fehlschlag
    # sichtbar (roter Job, Annotation), ohne `quality` als Ganzes zu kippen.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node (Version aus .nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (reproduzierbar)
        run: npm ci

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      - name: Build (Static Export)
        run: npm run build

      - name: Pixel-Baselines prüfen
        run: npx playwright test --grep "hält die Baseline"

      - name: Diff-Artefakt für die Bewertung
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-diff
          path: |
            test-results
          retention-days: 7

      - name: Befund zusammenfassen
        if: ${{ failure() }}
        run: |
          echo "::warning title=Visuelles Gate::Pixel-Baselines weichen ab. Das blockiert den Deploy NICHT, ist aber eine UI-Drift-Meldung: Baselines bewusst neu aufnehmen (npm run … --update-snapshots) oder die Änderung zurücknehmen."
