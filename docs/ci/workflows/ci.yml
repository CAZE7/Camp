name: CI

# Pflicht-Check für Pull Requests.
# Die eigentliche Prüfung liegt in `quality.yml`, damit PR und Deploy
# garantiert dieselbe Messlatte verwenden.
#
# Hinweis (D07): Trigger läuft gezielt nur auf Pull Requests und workflow_dispatch,
# um redundante Doppelläufe (push + pull_request) auf demselben Commit zu vermeiden.
# Pushes auf den Default-Branch laufen direkt durch deploy.yml (inklusive Quality Gate).

on:
  pull_request:
    branches: ["**"]
    # Seit dem 2026-11-12 ist das Repo öffentlich; die Actions-Minuten sind
    # damit unbegrenzt (vorher: 2.000/Monat). Die Ausnahmen bleiben trotzdem:
    # Ein Doku-PR braucht kein Gate. Es ist keine Ersparnis mehr, sondern
    # weniger Warteschlange und ein schnelleres Häkchen.
    #
    # Bewusst NICHT ausgenommen: `app/`, `components/`, `lib/`, `store/`,
    # `tests/`, `scripts/`, `package*.json` und alles unter `.github/`.
    # Ein Lauf, der bei einem Workflow-Fehler nicht startet, wäre blind —
    # gerade die Änderung an dieser Datei soll geprüft werden.
    #
    # Ebenso bewusst NICHT ausgenommen: `*.md` unter `app/` und `components/`
    # sowie `docs/`. Ein Test (`scripts/ci/workflows.test.ts`) hält fest, dass
    # die Ausnahmen nur Doku und Bilder treffen und nichts Ausführbares.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "public/**"
      - "audit-out/**"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read
