name: Verify Routing V2

# Workflow zur Verifikation von Routing V2 (IMPLEMENTATION-V2.md § 3).
# Führt die Routing-V2-Gates, Unit-/Integrationstests sowie den Static Export aus.
#
# Regeln (AGENTS.md / docs/CI.md):
#   - `npm ci` mit vorhandenem Lockfile, kein Fallback auf `npm install`.
#   - Node-Version kommt aus `.nvmrc`.
#   - Minimale Berechtigungen: nur Lesezugriff auf den Inhalt (contents: read).
#   - Aktionen per 40-Zeichen-Commit-SHA gepinnt.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Routing V2 Gates, Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node (Version aus .nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Lockfile vorhanden?
        run: |
          test -f package-lock.json || {
            echo "::error file=package-lock.json::package-lock.json fehlt - reproduzierbare Installation nicht möglich"
            exit 1
          }

      - name: Install (reproduzierbar)
        run: npm ci

      - name: Routing V2 Gates (G1–G7 & Stress-Tests)
        run: npm run verify:routing-v2

      - name: Unit- und Komponententests
        run: npm test

      - name: Build (Static Export)
        run: npm run build

      - name: Static Export vorhanden?
        run: |
          test -f ./out/index.html || {
            echo "::error::Static Export unvollständig - ./out/index.html fehlt"
            exit 1
          }
