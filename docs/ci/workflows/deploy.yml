name: Deploy to GitHub Pages

# Deploy läuft ausschließlich nach einem grünen Quality Gate.
# Es gibt bewusst KEINEN "skip_tests"-Notausgang: ein Deploy ohne Prüfung
# wäre eine unbelegte Qualitätsbehauptung (AGENTS.md K6).
#
# Hinweis (F2): Der Quality-Gate-Job baut ohne NEXT_PUBLIC_BASE_PATH,
# dieser Job baut erneut mit Base-Path für GitHub Pages. Das ist ein
# bewusster Trade-off: NEXT_PUBLIC_BASE_PATH ist ein reiner String-Ersatz
# (Asset-Pfade), der Build-Output ist ansonsten deterministisch gleich.
# Ein Routing-Bug durch falschen Base-Path fällt im Smoke-Check nach dem Deploy auf.

on:
  push:
    # Nur Pushes auf den Release-Branch lösen den Workflow aus.
    # Vorher triggerte `branches-ignore` bei JEDEM der 100+ Agent-/
    # Dependabot-Branches einen Run, in dem dann alle Jobs übersprungen
    # wurden („Skipped“-Rauschen, Befund: 13 der letzten 20 Runs ohne
    # Wirkung) und die Actions-Warteschlange belegt war.
    # WICHTIG: `branches` kann keine Ausdrücke auswerten. Wechselt der
    # Default-Branch des Repos, muss diese Liste manuell mitwandern —
    # der `if`-Schutz an den Jobs (Default-Branch-Vergleich) bleibt davon
    # unberührt und verhindert weiterhin Deploys von falschen Branches
    # (z. B. bei workflow_dispatch).
    branches: ["feature/react-flow-cable-editor-7322653268250495059"]
  workflow_dispatch:

# Standard: nur Lesen. Schreibrechte werden pro Job vergeben.
permissions:
  contents: read

concurrency:
  # Genau ein Deploy-Vorgang gleichzeitig. Ein laufender Produktiv-Deploy
  # wird NIEMALS abgebrochen (cancel-in-progress: false) — Befund: mit
  # cancel-in-progress: true gingen am 31.08.2026 zwei Deploy-Runs nach
  # schnell aufeinanderfolgenden Merges verloren (Runs 33373496497 und
  # 33373509862, „Canceling since a higher priority waiting request for
  # pages exists“). Neue Runs reihen sich stattdessen in die Warteschlange
  # ein; der jeweils neueste wartende Run ersetzt ältere wartende.
  group: "pages"
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # ── 1) Dieselbe Prüfung wie im Pull Request ────────────────────────────────
  quality:
    name: Quality Gate
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  # ── 2) Pages-Build (Basepath/Assets für GitHub Pages) ──────────────────────
  build:
    name: Pages-Build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      # id-token wird nur vom deploy-Job (actions/deploy-pages) benötigt.
      # Hier bewusst NICHT gesetzt (Least-Privilege-Prinzip).
    outputs:
      artifact_size: ${{ steps.size.outputs.size }}
      page_count: ${{ steps.size.outputs.pages }}
      asset_list: ${{ steps.size.outputs.asset_list }}
      smoke_asset: ${{ steps.size.outputs.asset }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node (Version aus .nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Next.js-Build-Cache wiederherstellen
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          # Cache-Key: Lockfile + alle TS/TSX/CSS-Quellen + JS/MJS-Konfigs.
          # postcss.config.js und eslint.config.mjs explizit mitgehasht,
          # da sie den Build-Output beeinflussen können.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.css', '**/*.mjs', 'postcss.config.js') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Install (reproduzierbar)
        run: npm ci

      - name: Impressum vollständig? (AUDIT „Impressum-Placeholder")
        # `app/impressum/page.tsx` wird öffentlich ausgeliefert; ein unvollständiges
        # Impressum ist abmahnfähig. Der Wächter läuft hier und nicht im Quality
        # Gate: ein Pull Request ist keine Veröffentlichung.
        # Stufe ist Entscheidung des Betreibers (2026-09-26): `warn` meldet offen
        # an der Stelle des Risikos, `block` stoppt die Veröffentlichung.
        env:
          LEGAL_NOTICE_GATE: warn
        run: npm run ci:verify-legal-notice

      - name: Pages konfigurieren
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          static_site_generator: next

      - name: Build (Static Export)
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Jekyll deaktivieren
        run: touch ./out/.nojekyll

      - name: Source Maps entfernen
        run: find ./out -name "*.map" -type f -delete

      - name: Artefaktgröße messen
        id: size
        run: |
          SIZE=$(du -sh ./out | cut -f1)
          PAGES=$(find ./out -name "index.html" | wc -l | tr -d ' ')
          echo "size=${SIZE}" >> "$GITHUB_OUTPUT"
          echo "pages=${PAGES}" >> "$GITHUB_OUTPUT"
          # Referenz für den Smoke-Check im Deploy-Job: ALLE im HTML
          # referenzierten Bundle-Dateinamen, nicht einer. Ein einzelner
          # Chunk-Name ist über zwei Builds hinweg identisch — belegt: die
          # ausgelieferte Version von 2026-09-10 teilte mehrere Chunk-Namen mit
          # einem frischen Build, nur die Menge unterscheidet die Baustellen.
          # Basenames, weil GitHub Pages den Base-Pfad vorstellt und der sonst
          # mitverglichen würde.
          FILES=$(grep -oE '"/[^"]*_next/static/[^"]*\.js"' ./out/index.html | tr -d '"' | xargs -n1 basename | sort -u)
          if [ -z "$FILES" ]; then
            echo "::error file=out/index.html::Kein referenziertes Bundle in ./out/index.html — der Smoke-Check hätte keine Referenz und wäre eine leere Behauptung."
            exit 1
          fi
          echo "asset_list=$(echo "$FILES" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          FIRST=$(printf '%s\n' "$FILES" | head -1)
          echo "asset=$(grep -oE "\"[^\"]*${FIRST}\"" ./out/index.html | head -1 | tr -d '"')" >> "$GITHUB_OUTPUT"

      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./out

  # ── 3) Veröffentlichen & Smoke-Check ───────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Smoke-Check (Auslieferung identisch zum gebauten Stand)
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
          SMOKE_ASSET: ${{ needs.build.outputs.smoke_asset }}
          ASSET_LIST: ${{ needs.build.outputs.asset_list }}
        run: |
          set -eu
          # Pages übernimmt die Umgebung asynchron. Gewartet wird auf Inhalt,
          # nicht auf Zeit: ein HTTP 200 auf eine noch ausgelieferte Altversion
          # wäre kein Beleg für diesen Deploy — genau diesen Zustand hat der
          # alte Check übersehen, und die Seite lief 16 Tage lang gegen einen
          # Build von 2026-09-10.
          ATTEMPT=0
          MATCHED=0
          MISSING=""
          while [ "$ATTEMPT" -lt 12 ]; do
            ATTEMPT=$((ATTEMPT + 1))
            HTML=$(curl -s -L --max-time 20 "${DEPLOYED_URL}" || true)
            MISSING=""
            if [ -n "${HTML}" ]; then
              for f in ${ASSET_LIST}; do
                case "${HTML}" in
                  *"${f}"*) ;;
                  *) MISSING="${MISSING} ${f}" ;;
                esac
              done
            fi
            if [ -n "${HTML}" ] && [ -z "${MISSING}" ]; then
              MATCHED=1
              break
            fi
            sleep 5
          done
          if [ "${MATCHED}" -ne 1 ]; then
            echo "::error::Die ausgelieferte Seite ist NICHT der gebaute Stand. Fehlende Bundles:${MISSING} (nach ${ATTEMPT} Versuchen). Entweder wurde eine ältere Version ausgeliefert, oder die Seite ist kaputt."
            exit 1
          fi
          set -- ${ASSET_LIST}
          echo "✔ Ausgelieferte Seite ist der gebaute Stand ($# Bundles alle nachgewiesen)."
          # Jedes referenzierte Bundle muss unter seinem Base-Pfad antworten,
          # sonst ist die Seite zwar 200, aber weiß.
          ORIGIN=$(printf '%s' "${DEPLOYED_URL}" | sed -E 's#^(https?://[^/]+).*#\1#')
          ASSET_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 20 "${ORIGIN}${SMOKE_ASSET}" || echo 000)
          if [ "${ASSET_STATUS}" != "200" ]; then
            echo "::error::Referenziertes Asset ${SMOKE_ASSET} antwortet mit ${ASSET_STATUS} (erwartet 200) — Base-Pfad oder Auslieferung fehlerhaft."
            exit 1
          fi
          echo "✔ Asset erreichbar: ${SMOKE_ASSET}"

      - name: Zusammenfassung
        run: |
          {
            echo "## Deployment"
            echo ""
            echo "| | |"
            echo "|-|-|"
            echo "| URL | ${{ steps.deployment.outputs.page_url }} |"
            echo "| Größe | ${{ needs.build.outputs.artifact_size }} |"
            echo "| Seiten | ${{ needs.build.outputs.page_count }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Smoke-Check | ✅ ausgelieferte Bundles = gebaute Bundles, Asset 200 |"
          } >> "$GITHUB_STEP_SUMMARY"
