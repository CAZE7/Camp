<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      Elektroplaner · Ansichten-Prototyp (Recherche-Begleitmaterial)
    </title>
    <style>
      :root {
        --bg: #f4f3f0;
        --panel: #fbfaf8;
        --raised: #ffffff;
        --rule: #d8d4cd;
        --rule-strong: #b6b1a8;
        --ink: #1c1b18;
        --ink-2: #57534a;
        --ink-3: #8a857b;
        --accent: #b4552d; /* oxide/copper */
        --wire-dc: #c2413b;
        --wire-neg: #26241f;
        --wire-solar: #b07d10;
        --wire-ac: #2f5fa8;
        --wire-pe: #2c7a4b;
        --ok: #2c7a4b;
        --warn: #b07d10;
        --err: #b3372f;
        --band: #efede8;
        --mono:
          "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas,
          monospace;
        --sans:
          "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --shadow:
          0 1px 2px rgba(28, 27, 24, 0.08), 0 8px 24px rgba(28, 27, 24, 0.06);
      }
      html.dark {
        --bg: #141513;
        --panel: #1b1c1a;
        --raised: #22231f;
        --rule: #33342f;
        --rule-strong: #4a4b44;
        --ink: #ece9e2;
        --ink-2: #b3afa5;
        --ink-3: #807c73;
        --accent: #e08a5c;
        --wire-dc: #e0655c;
        --wire-neg: #c9c6bd;
        --wire-solar: #d9a53a;
        --wire-ac: #6f9bdd;
        --wire-pe: #5cb483;
        --ok: #5cb483;
        --warn: #d9a53a;
        --err: #e0655c;
        --band: #1e1f1c;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.45;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: none;
        cursor: pointer;
      }
      .mono {
        font-family: var(--mono);
      }

      header.top {
        position: sticky;
        top: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--rule);
      }
      .brand {
        display: flex;
        align-items: baseline;
        gap: 10px;
        min-width: 0;
      }
      .brand b {
        font-size: 15px;
        letter-spacing: 0.2px;
        white-space: nowrap;
      }
      .brand span {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--ink-3);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tabs {
        display: flex;
        gap: 4px;
        overflow-x: auto;
        scrollbar-width: thin;
        padding: 2px;
      }
      .tab {
        display: flex;
        align-items: center;
        gap: 7px;
        white-space: nowrap;
        padding: 8px 12px;
        border: 1px solid transparent;
        border-radius: 8px;
        color: var(--ink-2);
        font-weight: 600;
        font-size: 12.5px;
      }
      .tab:hover {
        background: var(--raised);
        color: var(--ink);
      }
      .tab[aria-selected="true"] {
        background: var(--raised);
        border-color: var(--rule-strong);
        color: var(--ink);
        box-shadow: var(--shadow);
      }
      .tab .dot {
        width: 8px;
        height: 8px;
        border-radius: 2px;
        background: var(--accent);
      }
      .spacer {
        flex: 1;
      }
      .iconbtn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border: 1px solid var(--rule);
        border-radius: 8px;
        background: var(--raised);
      }
      .iconbtn:hover {
        border-color: var(--rule-strong);
      }

      .subbar {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        padding: 8px 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--rule);
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .chip {
        padding: 5px 10px;
        border: 1px solid var(--rule);
        border-radius: 999px;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--ink-2);
        background: var(--raised);
      }
      .chip[aria-pressed="true"] {
        color: #fff;
        border-color: transparent;
      }
      .hint {
        font-size: 11.5px;
        color: var(--ink-3);
      }
      .seg {
        display: flex;
        border: 1px solid var(--rule);
        border-radius: 8px;
        overflow: hidden;
        background: var(--raised);
      }
      .seg button {
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 600;
        color: var(--ink-2);
      }
      .seg button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--bg);
      }

      main {
        display: flex;
        gap: 0;
        align-items: stretch;
        min-height: calc(100vh - 105px);
      }
      .stage {
        flex: 1;
        min-width: 0;
        padding: 16px;
        overflow: auto;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--rule);
        border-radius: 12px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .card-h {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--rule);
      }
      .card-h h2 {
        margin: 0;
        font-size: 13px;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        color: var(--ink-2);
      }
      .card-b {
        padding: 14px;
      }
      svg {
        display: block;
        width: 100%;
        height: auto;
      }
      svg text {
        font-family: var(--sans);
        fill: var(--ink);
      }
      svg .mono {
        font-family: var(--mono);
      }

      aside.info {
        width: 330px;
        flex: none;
        border-left: 1px solid var(--rule);
        background: var(--panel);
        padding: 16px;
        overflow: auto;
      }
      aside.info h3 {
        margin: 0 0 4px;
        font-size: 13px;
      }
      aside.info .k {
        font-family: var(--mono);
        font-size: 10.5px;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        color: var(--ink-3);
        margin: 14px 0 4px;
      }
      aside.info p {
        margin: 0 0 8px;
        font-size: 12.5px;
        color: var(--ink-2);
      }
      aside.info ul {
        margin: 0;
        padding-left: 18px;
        font-size: 12.5px;
        color: var(--ink-2);
      }
      aside.info li {
        margin-bottom: 4px;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.4px;
      }
      .b-s {
        background: color-mix(in srgb, var(--ok) 18%, transparent);
        color: var(--ok);
      }
      .b-m {
        background: color-mix(in srgb, var(--warn) 20%, transparent);
        color: var(--warn);
      }
      .b-l {
        background: color-mix(in srgb, var(--err) 16%, transparent);
        color: var(--err);
      }
      @media (max-width: 1100px) {
        aside.info {
          display: none;
        }
      }

      /* Tabellen */
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12.5px;
      }
      th,
      td {
        padding: 8px 10px;
        border-bottom: 1px solid var(--rule);
        text-align: left;
        vertical-align: top;
      }
      th {
        font-size: 10.5px;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        color: var(--ink-3);
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
      }
      th .arr {
        color: var(--accent);
      }
      td.mono,
      th.mono {
        font-family: var(--mono);
        font-size: 11.5px;
      }
      tbody tr:hover {
        background: var(--raised);
      }
      tbody tr.sel {
        background: color-mix(in srgb, var(--accent) 10%, transparent);
      }
      .pill {
        display: inline-block;
        padding: 1px 7px;
        border-radius: 6px;
        font-size: 10.5px;
        font-weight: 700;
        font-family: var(--mono);
      }
      .st-ok {
        color: var(--ok);
      }
      .st-warn {
        color: var(--warn);
      }
      .st-err {
        color: var(--err);
      }

      /* Stromkreis-Raster */
      .circuits {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .crow {
        display: grid;
        grid-template-columns: 120px 1fr 190px 120px 110px;
        gap: 12px;
        align-items: center;
        padding: 10px 12px;
        border: 1px solid var(--rule);
        border-radius: 10px;
        background: var(--raised);
      }
      .crow:hover {
        border-color: var(--rule-strong);
      }
      .crow .fuse {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 700;
      }
      .fusebox {
        width: 34px;
        height: 20px;
        border: 1.5px solid var(--ink-2);
        border-radius: 3px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
      }
      .crow .load {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .crow .load .nm {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .crow .load .sp {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--ink-3);
        white-space: nowrap;
      }
      .bar {
        height: 6px;
        border-radius: 3px;
        background: var(--band);
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--wire-dc);
      }
      @media (max-width: 900px) {
        .crow {
          grid-template-columns: 100px 1fr;
          grid-auto-rows: auto;
        }
        .crow .hide-s {
          display: none;
        }
      }

      /* Blatt / Druck */
      .sheetwrap {
        display: flex;
        justify-content: center;
        padding: 8px 0 24px;
      }
      .sheet {
        width: 794px;
        max-width: 100%;
        background: #fff;
        color: #17181a;
        border: 1px solid var(--rule-strong);
        box-shadow: var(--shadow);
        padding: 34px 40px;
        position: relative;
      }
      .sheet h1 {
        font-size: 17px;
        margin: 0 0 2px;
      }
      .sheet .sub {
        font-family: var(--mono);
        font-size: 10.5px;
        color: #5c5f66;
        letter-spacing: 0.5px;
      }
      .sheet .frame {
        border: 1px solid #9aa0a8;
        margin-top: 14px;
        padding: 12px;
      }
      .tblock {
        position: absolute;
        right: 40px;
        bottom: 34px;
        width: 300px;
        border: 1px solid #9aa0a8;
        font-family: var(--mono);
        font-size: 9.5px;
      }
      .tblock div {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 3px 7px;
        border-top: 1px solid #c3c8cf;
      }
      .tblock div:first-child {
        border-top: none;
        font-weight: 700;
      }
      @media print {
        body {
          background: #fff;
        }
        header.top,
        .subbar,
        aside.info,
        .noprint {
          display: none !important;
        }
        main {
          display: block;
          min-height: 0;
        }
        .stage {
          padding: 0;
          overflow: visible;
        }
        .card {
          border: none;
          box-shadow: none;
          border-radius: 0;
        }
        .sheetwrap {
          padding: 0;
        }
        .sheet {
          width: auto;
          border: none;
          box-shadow: none;
          padding: 10mm;
        }
        .tblock {
          right: 10mm;
          bottom: 10mm;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">

    <main>

      /* ---------- kleine Helfer ---------- */
      const el = (tag, attrs, kids) => {
        const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
        (kids || []).forEach((c) =>
          e.appendChild(typeof c === "string" ? document.createTextNode(c) : c),
        );
        return e;
      };
      const H = (html) => {
        const t = document.createElement("template");
        t.innerHTML = html.trim();
        return t.content.firstChild;

      const esc = (s) =>
        String(s).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const fmt = (x, d = 1) => Number(x).toFixed(d).replace(".", ",");

      /* ============================================================================
   ANSICHT 1 — Status quo (Mehrlinien-Graph, wie heute im Planer)
   ========================================================================== */

        pv1: [60, 40],

      function nodeCard(g, n, x, y, opts = {}) {
        const w = opts.w || NW,
          h = opts.h || NH;
        const grp = el("g", {
          transform: `translate(${x},${y})`,
          "data-node": n.id,
          class: "sq-node",

        grp.appendChild(
          el("rect", {
            width: w,
            height: h,
            rx: 6,
            fill: "var(--raised)",
            stroke: "var(--rule-strong)",
            "stroke-width": 1,

        grp.appendChild(
          el("rect", {
            width: 3,
            height: h,
            rx: 1.5,
            fill: DOMAIN_COLOR[n.dom],
          }),
        );
        grp.appendChild(
          el("text", { x: 12, y: 18, "font-size": 11, "font-weight": 700 }, [
            n.nm,
          ]),
        );
        (opts.spec !== false ? n.spec : []).slice(0, 2).forEach((s, i) => {
          grp.appendChild(
            el(
              "text",
              {
                x: 12,
                y: 33 + i * 13,
                "font-size": 9.5,
                class: "mono",
                fill: "var(--ink-3)",
              },
              [s],

        grp.appendChild(
          el(
            "text",

              "font-size": 11,
              "text-anchor": "end",
              fill: "var(--ink-3)",
            },

        g.appendChild(grp);
        return grp;

      /* Anker-Slots: mehrere Kabel an einer Node-Seite werden vertikal verteilt. */
      /* Liegt das Ziel links der Quelle (z. B. vertikal gestapelte Knoten in einer
   Spalte), würde ein Elbow zur linken Kante durch die Karten laufen. Solche
   Verbindungen werden deshalb an der RECHTEN Kante des Ziels eingeführt und
   über eine schmale Lane rechts der Quelle geführt. */
      const isBackwards = (c) => SQ_POS[c.b][0] <= SQ_POS[c.a][0];

      function anchors(conns) {
        const out = {},
          inn = {};
        conns.forEach((c) => {
          (out[c.a] = out[c.a] || []).push(c);
          (inn[c.b] = inn[c.b] || []).push(c);
        });
        const pos = {};
        const spread = (map, side) => {
          for (const id in map) {
            const list = map[id];
            const p = SQ_POS[id];
            list.forEach((c, i) => {
              const y = p[1] + (NH * (i + 1)) / (list.length + 1);
              const rightSide = side === "o" ? true : isBackwards(c);
              pos[c.id + ":" + side] = { x: rightSide ? p[0] + NW : p[0], y };
            });
          }
        };
        spread(out, "o");
        spread(inn, "i");
        return pos;
      }

      let cableSort = { key: "id", dir: 1 };
      function cableRows() {
        return C.map((c) => ({
          id: c.id,
          von: byId[c.a].nm,
          nach: byId[c.b].nm,
          fn:
            c.kind === "ac"
              ? "AC 230 V"
              : c.kind === "solar"
                ? "Solar DC"
                : c.kind === "gnd"
                  ? "PE / Masse"
                  : c.kind === "main"
                    ? "Hauptleitung"
                    : "DC 12 V",
          adern: c.adern,
          cs: c.cs,
          len: c.len,
          fuse: c.fuse || "—",
          kreis: c.circ,
          route: c.route,
          status:
            c.cs < 1.5 ? "err" : c.fuse && c.fuse > 25 * c.cs ? "warn" : "ok",
        }));
      }
      function renderCableTable(host) {
        const keys = [
          ["id", "Kabel"],
          ["von", "Von"],
          ["nach", "Nach"],
          ["fn", "Funktion"],
          ["adern", "Adern"],
          ["cs", "mm²"],
          ["len", "Länge m"],
          ["fuse", "Sicherung A"],
          ["kreis", "Stromkreis"],
          ["route", "Verlegeort"],
          ["status", "Status"],
        ];
        const rows = cableRows().sort((a, b) => {
          const k = cableSort.key;
          const va = a[k],
            vb = b[k];
          return (va > vb ? 1 : va < vb ? -1 : 0) * cableSort.dir;
        });
        const card =
          H(`<div class="card"><div class="card-h"><h2>Kabelliste (Kabelverzeichnis nach IEC-81346-Prinzip)</h2>
     <span class="spacer" style="flex:1"></span>
     <button class="chip noprint" id="csv" aria-pressed="false">CSV kopieren</button></div>
     <div class="card-b" style="padding:0 6px 10px"><table><thead><tr id="th"></tr></thead><tbody id="tb"></tbody></table></div></div>`);
        const thr = card.querySelector("#th");
        keys.forEach(([k, label]) => {
          const th = H(
            `<th data-k="${k}">${label}${cableSort.key === k ? ` <span class="arr">${cableSort.dir > 0 ? "▲" : "▼"}</span>` : ""}</th>`,
          );
          if (["adern", "cs", "len", "fuse"].includes(k))
            th.classList.add("mono");
          th.onclick = () => {
            cableSort = {
              key: k,
              dir: cableSort.key === k ? -cableSort.dir : 1,
            };
            rerender();
          };
          thr.appendChild(th);
        });
        const tb = card.querySelector("#tb");
        rows.forEach((r) => {
          const tr = H(`<tr>
      <td class="mono">-${r.id}</td><td>${esc(r.von)}</td><td>${esc(r.nach)}</td><td>${r.fn}</td>
      <td class="mono">${r.adern}</td><td class="mono">${r.cs}</td><td class="mono">${fmt(r.len)}</td>
      <td class="mono">${r.fuse}</td><td class="mono">${r.kreis}</td><td>${esc(r.route)}</td>
      <td class="${"st-" + r.status} mono">${r.status === "ok" ? "●" : r.status === "warn" ? "▲" : "■"}</td></tr>`);
          tb.appendChild(tr);
        });
        card.querySelector("#csv").onclick = (e) => {
          const head = keys.map((k) => k[1]).join(";");
          const body = cableRows()
            .map((r) =>
              [
                r.id,
                r.von,
                r.nach,
                r.fn,
                r.adern,
                r.cs,
                r.len,
                r.fuse,
                r.kreis,
                r.route,
                r.status,
              ].join(";"),
            )
            .join("\n");
          navigator.clipboard?.writeText(head + "\n" + body);
          e.target.textContent = "✓ kopiert";
          setTimeout(() => (e.target.textContent = "CSV kopieren"), 1500);
        };
        host.appendChild(card);
      }

      /* ============================================================================
   ANSICHT 7 — Energiebilanz
   ========================================================================== */
      function ahOf(n, season) {
        if (!n.w) return 0;
        const h = season === "winter" ? n.hW : n.hS;
        const wh = n.w * h;
        return n.kind === "consumer230v" ? wh / 0.85 / 12 : wh / 12;
      }
      function renderEnergy(host, season, setSeason) {
        const loads = N.filter((n) => n.w)
          .map((n) => ({ n, ah: ahOf(n, season) }))
          .sort((a, b) => b.ah - a.ah);
        const sum = loads.reduce((s, l) => s + l.ah, 0);
        const prod = [
          {
            nm: `Solar 300 Wp (${season === "winter" ? "1,2" : "4,5"} h Sonne)`,
            ah:
              season === "winter"
                ? (300 * 1.2 * 0.8) / 12
                : (300 * 4.5 * 0.8) / 12,
          },
          { nm: "Ladebooster (Fahrzeit 1,5 h)", ah: 30 * 1.5 },
          { nm: "Landstrom-AC-Lader (2 h, optional)", ah: 20 * 2 },
        ];
        const psum = prod.reduce((s, p) => s + p.ah, 0);
        const max = Math.max(sum, psum);
        const card =
          H(`<div class="card"><div class="card-h"><h2>Energiebilanz pro Tag</h2>
    <span class="spacer" style="flex:1"></span>
    <div class="seg"><button id="s" aria-pressed="${season === "summer"}">Sommer</button><button id="w" aria-pressed="${season === "winter"}">Winter</button></div>
    </div><div class="card-b" id="eb"></div></div>`);
        const body = card.querySelector("#eb");
        const bar = (label, ah, color, note) =>
          H(`<div style="display:grid;grid-template-columns:230px 1fr 90px;gap:10px;align-items:center;margin-bottom:7px">
     <span style="font-size:12px">${esc(label)}</span>
     <span class="bar" style="height:10px"><i style="width:${Math.round((ah / max) * 100)}%;background:${color}"></i></span>
     <span class="mono" style="font-size:11px;color:var(--ink-2);text-align:right">${fmt(ah)} Ah${note || ""}</span></div>`);
        body.appendChild(
          H(`<div class="hint" style="margin-bottom:6px">VERBRAUCH</div>`),
        );
        loads.forEach((l) =>
          body.appendChild(
            bar(`${KIND_ICON[l.n.kind]} ${l.n.nm}`, l.ah, "var(--wire-dc)"),
          ),
        );
        body.appendChild(bar("Σ Verbrauch", sum, "var(--ink-2)", " /Tag"));
        body.appendChild(
          H(
            `<div class="hint" style="margin:14px 0 6px">ERTRAG / LADUNG</div>`,
          ),
        );
        prod.forEach((p) => body.appendChild(bar(p.nm, p.ah, "var(--ok)")));
        body.appendChild(bar("Σ Ertrag", psum, "var(--ink-2)", " /Tag"));
        const diff = psum - sum;
        body.appendChild(
          H(`<div style="margin-top:14px;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--raised);font-size:12.5px">
     Bilanz: <b class="mono ${diff >= 0 ? "st-ok" : "st-err"}">${diff >= 0 ? "+" : ""}${fmt(diff)} Ah/Tag</b> ·
     Batterie nutzbar 190 Ah → Autarkie ohne Laden ≈ <b class="mono">${fmt(190 / Math.max(sum, 1), 1)} Tage</b>.
     <span class="hint">Diese Ansicht beantwortet „Ist meine Anlage ausgelegt?“ in 3 Sekunden — der Graph kann das nicht.</span></div>`),
        );
        card.querySelector("#s").onclick = () => setSeason("summer");
        card.querySelector("#w").onclick = () => setSeason("winter");
        host.appendChild(card);
      }

            head("Kabelliste") +
            `<div class="frame"><table><thead><tr>
      <th>Kabel</th><th>Von</th><th>Nach</th><th>Funktion</th><th>Adern</th><th>mm²</th><th>m</th><th>Sicherung</th><th>Trasse</th></tr></thead><tbody>` +
            cableRows()
              .map(
                (
                  r,
                ) => `<tr><td class="mono">-${r.id}</td><td>${r.von}</td><td>${r.nach}</td><td>${r.fn}</td>
        <td class="mono">${r.adern}</td><td class="mono">${r.cs}</td><td class="mono">${fmt(r.len)}</td><td class="mono">${r.fuse}</td><td>${r.route}</td></tr>`,
              )
              .join("") +
            `</tbody></table></div>` +
            tblock;
        }
        wrap.querySelectorAll("[data-sh]").forEach(
          (b) =>
            (b.onclick = () => {
              sheet = +b.dataset.sh;
              rerender();
            }),
        );
        wrap.querySelector("#print").onclick = () => window.print();
        host.appendChild(wrap);
      }

      /* ============================================================================
   ANSICHT 9 — Split-Vergleich Status quo ↔ Einlinie
   ========================================================================== */
      function renderCompare(host) {
        const wrap =
          H(`<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
    <div class="card"><div class="card-h"><h2>Heute: mehrlinig</h2><span class="hint">${C.reduce((s, c) => s + c.adern, 0)} Linien</span></div><div class="card-b" id="a"></div></div>
    <div class="card"><div class="card-h"><h2>Vorschlag: einpolig</h2><span class="hint">${C.length} Linien (−${Math.round((1 - C.length / C.reduce((s, c) => s + c.adern, 0)) * 100)} %)</span></div><div class="card-b" id="b"></div></div>
  </div>`);
        renderStatusQuo(wrap.querySelector("#a"), {});
        renderSingleLine(wrap.querySelector("#b"), { labels: false });
        host.appendChild(wrap);
      }

      const state = {
        view: "single",
        season: "summer",
        active: new Set(["dc", "ac", "solar", "gnd"]),
        labels: true,
      };

      function rerender() {
        const view = VIEWS.find((v) => v.id === state.view);
        const tabs = document.getElementById("tabs");
        tabs.innerHTML = "";
        VIEWS.forEach((v) => {
          const dotStyle =
            v.id === state.view ? "" : ' style="background:var(--rule-strong)"';
          const b = H(
            `<button class="tab" role="tab" aria-selected="${v.id === state.view}"><span class="dot"${dotStyle}></span>${v.icon} ${v.label}</button>`,
          );
          b.onclick = () => {
            state.view = v.id;
            rerender();
          };
          tabs.appendChild(b);
        });

        /* Subbar */
        const sub = document.getElementById("subbar");
        sub.innerHTML = "";
        if (view.sub.some((s) => s.type === "domains")) {
          const chips = H(
            `<div class="chips" role="group" aria-label="Domänen filtern"></div>`,
          );
          [
            ["dc", "12V", "var(--wire-dc)"],
            ["ac", "230V", "var(--wire-ac)"],
            ["solar", "Solar", "var(--wire-solar)"],
            ["gnd", "PE", "var(--wire-pe)"],
          ].forEach(([id, label, color]) => {
            const on = state.active.has(id);
            const c = H(
              `<button class="chip" aria-pressed="${on}" style="${on ? `background:${color}` : ""}">${label}</button>`,
            );
            c.onclick = () => {
              on ? state.active.delete(id) : state.active.add(id);
              if (!state.active.size) state.active.add(id);
              rerender();
            };
            chips.appendChild(c);
          });
          sub.appendChild(chips);
        }
        if (view.sub.some((s) => s.type === "labels")) {
          const seg = H(
            `<div class="seg"><button id="lb0" aria-pressed="${!state.labels}">Struktur</button><button id="lb1" aria-pressed="${state.labels}">Mit Werten</button></div>`,
          );
          seg.querySelector("#lb0").onclick = () => {
            state.labels = false;
            rerender();
          };
          seg.querySelector("#lb1").onclick = () => {
            state.labels = true;
            rerender();
          };
          sub.appendChild(seg);
        }
        if (view.sub.some((s) => s.type === "season")) {
          const seg = H(
            `<div class="seg"><button id="ss" aria-pressed="${state.season === "summer"}">Sommer</button><button id="sw" aria-pressed="${state.season === "winter"}">Winter</button></div>`,
          );
          seg.querySelector("#ss").onclick = () => {
            state.season = "summer";
            rerender();
          };
          seg.querySelector("#sw").onclick = () => {
            state.season = "winter";
            rerender();
          };
          sub.appendChild(seg);
        }
        sub.appendChild(
          H(
            `<span class="hint">Beispieldaten: 22 Bauteile, ${C.length} Kabel (${C.reduce((s, c) => s + c.adern, 0)} Adern) · alle Ansichten lesen dieselbe Datenquelle</span>`,
          ),
        );

        /* Stage */
        const stage = document.getElementById("stage");
        stage.innerHTML = "";
        const card = document.createElement("div");
        view.render(card, {
          active: state.active,
          labels: state.labels,
          season: state.season,
          setSeason: (s) => {
            state.season = s;
            rerender();
          },
        });
        stage.appendChild(card);

        /* Info-Drawer */
        const info = document.getElementById("info");
        const i = view.info;
        const effortBadge =
          { S: "b-s", "S–M": "b-s", M: "b-m", L: "b-l" }[i.effort] || "b-m";
        info.innerHTML = `<h3>${view.icon} ${view.label}</h3>
    <p>${esc(i.purpose)}</p>
    <div class="k">Löst Befund</div><ul>${i.solves.map((s) => `<li>${esc(s)}</li>`).join("")}</ul>
    <div class="k">Norm / Quelle</div><p>${esc(i.norm)}</p>
    <div class="k">Aufwand</div><p><span class="badge ${effortBadge}">${esc(i.effort)}</span></p>
    <div class="k">Betroffene Stellen im Repo</div><p class="mono" style="font-size:11px">${esc(i.files)}</p>
    <div class="k">Anmerkungen</div><ul>${i.notes.map((s) => `<li>${esc(s)}</li>`).join("")}</ul>`;
      }

      document.getElementById("theme").onclick = () =>
        document.documentElement.classList.toggle("dark");
      rerender();
    </script>
