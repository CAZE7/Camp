name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main", "feature/*", "feature/react-flow-cable-editor-7322653268250495059"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Clear npm cache
        run: npm cache clean --force
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock', '**/*.{js,ts,jsx,tsx}') }}-${{ hashFiles('**/*.{js,ts,jsx,tsx}') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock', '**/*.{js,ts,jsx,tsx}') }}-
      - name: Verify npm cache
        run: |
          echo "Verifying npm cache"
          npm cache verify || npm cache clean --force || true

      - name: Install dependencies (npm ci with retries, fallback to npm install)
        run: |
          set -euo pipefail
          echo "Attempting npm ci (up to 3 retries), will fall back to npm install if it keeps failing"
          n=0
          until [ "$n" -ge 3 ]
          do
            if npm ci; then
              echo "npm ci succeeded"
              break
            fi
            n=$((n+1))
            echo "npm ci attempt $n failed — cleaning cache and retrying"
            npm cache clean --force || true
            sleep 2
          done
          if [ "$n" -ge 3 ]; then
            echo "npm ci failed after 3 attempts, switching to npm install fallback"
            rm -f package-lock.json
            npm install --no-audit --no-fund
          fi
      - name: Build with Next.js
        run: |
          # Build and export a static site into ./out for GitHub Pages
          npx next build
          npx next export -o out
      - name: Optimize Artifact (Remove Source Maps)
        run: find ./out -name "*.map" -type f -delete || true
      - name: Disable Jekyll
        run: touch ./out/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
