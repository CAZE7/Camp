name: Deploy to GitHub Pages

# Deploy läuft ausschließlich nach einem grünen Quality Gate.
# Es gibt bewusst KEINEN "skip_tests"-Notausgang: ein Deploy ohne Prüfung
# wäre eine unbelegte Qualitätsbehauptung (AGENTS.md K6).

on:
  push:
    branches-ignore: ["gh-pages"]
  workflow_dispatch:

# Standard: nur Lesen. Schreibrechte werden pro Job vergeben.
permissions:
  contents: read

concurrency:
  group: pages
  # Bei mehreren Pushes ist nur der neueste Stand veröffentlichungswürdig.
  # Alte Builds dürfen keine 30-Minuten-Läufe hintereinander aufstauen.
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # ── 1) Dieselbe Prüfung wie im Pull Request ────────────────────────────────
  quality:
    name: Quality Gate
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  # ── 2) Pages-Build (Basepath/Assets für GitHub Pages) ──────────────────────
  build:
    name: Pages-Build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      artifact_size: ${{ steps.size.outputs.size }}
      page_count: ${{ steps.size.outputs.pages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node (Version aus .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Next.js-Build-Cache wiederherstellen
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.css') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Install (reproduzierbar)
        run: npm ci

      - name: Pages konfigurieren
        id: pages
        uses: actions/configure-pages@v6
        with:
          static_site_generator: next

      - name: Build (Static Export)
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Jekyll deaktivieren
        run: touch ./out/.nojekyll

      - name: Source Maps entfernen
        run: find ./out -name "*.map" -type f -delete

      - name: Artefaktgröße messen
        id: size
        run: |
          SIZE=$(du -sh ./out | cut -f1)
          PAGES=$(find ./out -name "index.html" | wc -l | tr -d ' ')
          echo "size=${SIZE}" >> "$GITHUB_OUTPUT"
          echo "pages=${PAGES}" >> "$GITHUB_OUTPUT"

      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # ── 3) Veröffentlichen ─────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Zusammenfassung
        run: |
          {
            echo "## Deployment"
            echo ""
            echo "| | |"
            echo "|-|-|"
            echo "| URL | ${{ steps.deployment.outputs.page_url }} |"
            echo "| Größe | ${{ needs.build.outputs.artifact_size }} |"
            echo "| Seiten | ${{ needs.build.outputs.page_count }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
