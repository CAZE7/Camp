name: 🚀 CI/CD — Build & Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master", "feature/**"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests (emergency deploy)"
        required: false
        default: "false"
        type: boolean

# ── Permissions ───────────────────────────────────────────────────────────────
permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

# ── Concurrency ───────────────────────────────────────────────────────────────
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ── Global Environment ────────────────────────────────────────────────────────
env:
  NODE_VERSION: "20"
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # ╔═══════════════════════════════════════════════════════════════╗
  # ║  JOB 1: TypeScript Check  (runs in parallel with tests)      ║
  # ╚═══════════════════════════════════════════════════════════════╝
  typecheck:
    name: 🔎 TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline

      - name: 🔎 TypeScript check
        run: npx tsc --noEmit -p tsconfig.typecheck.json

  # ╔═══════════════════════════════════════════════════════════════╗
  # ║  JOB 2: Unit Tests  (runs in parallel with typecheck)        ║
  # ╚═══════════════════════════════════════════════════════════════╝
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_tests != 'true' }}
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline

      - name: 🧪 Run tests
        run: npm test -- --reporter=verbose

  # ╔═══════════════════════════════════════════════════════════════╗
  # ║  JOB 3: Production Build  (waits for quality gates)          ║
  # ╚═══════════════════════════════════════════════════════════════╝
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    if: |
      always() &&
      needs.typecheck.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    outputs:
      artifact_size: ${{ steps.size.outputs.size }}
      page_count: ${{ steps.size.outputs.pages }}
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: ♻️ Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.js', '**/*.jsx', '**/*.css') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: 📦 Install dependencies (with retry fallback)
        run: |
          set -euo pipefail
          n=0
          until [ "$n" -ge 3 ]; do
            if npm ci --prefer-offline; then
              echo "✅ npm ci succeeded"
              break
            fi
            n=$((n+1))
            echo "⚠️  npm ci attempt $n failed — cleaning cache and retrying"
            npm cache clean --force || true
            sleep 2
          done
          if [ "$n" -ge 3 ]; then
            echo "🔄 npm ci failed after 3 attempts, falling back to npm install"
            rm -f package-lock.json
            npm install --no-audit --no-fund
          fi

      - name: 🏗️ Configure Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: 🔨 Build Next.js app
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: 🚫 Disable Jekyll
        run: touch ./out/.nojekyll

      - name: 🗺️ Strip source maps
        run: find ./out -name "*.map" -type f -delete || true

      - name: 📊 Measure artifact size
        id: size
        run: |
          SIZE=$(du -sh ./out | cut -f1)
          PAGES=$(find ./out -name "index.html" | wc -l | tr -d ' ')
          echo "size=${SIZE}" >> $GITHUB_OUTPUT
          echo "pages=${PAGES}" >> $GITHUB_OUTPUT
          echo "## 📦 Build Artifact" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total size | ${SIZE} |" >> $GITHUB_STEP_SUMMARY
          echo "| Static pages | ${PAGES} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY

      - name: ⬆️ Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # ╔═══════════════════════════════════════════════════════════════╗
  # ║  JOB 4: Deploy  (only on main/master push — never on PRs)    ║
  # ╚═══════════════════════════════════════════════════════════════╝
  deploy:
    name: 🌍 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: ✅ Deployment Summary
        run: |
          echo "## 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|-|-|" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 URL | ${{ steps.deployment.outputs.page_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Size | ${{ needs.build.outputs.artifact_size }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📄 Pages | ${{ needs.build.outputs.page_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔀 Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
