name: Visual DE — Dark Engineering

on:
  pull_request:
    paths:
      - 'app/dark-engineering.css'
      - 'app/globals.css'
      - 'app/design-system/**'
      - 'components/design-system/**'
      - 'components/nodes/**'
      - 'components/edges/**'
      - 'components/planner/**'
      - 'lib/design-system/**'
      - 'tailwind.config.ts'
      - 'tests/e2e/visual-de.spec.ts'

jobs:
  visual-de:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Install Playwright
        run: npx playwright install --with-deps
      - name: Run DE Visual Tests
        run: npx playwright test tests/e2e/visual-de.spec.ts --reporter=github
      - name: Upload DE Snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: de-visual-snapshots
          path: tests/e2e/visual-de.spec.ts-snapshots/
          retention-days: 7
      - name: Check Token Hygiene
        run: ./node_modules/.bin/vitest run lib/designTokens.test.ts --run
      - name: Check DE Tokens Contrast
        run: |
          echo "DE Tokens: 216 tests must be green"
          ./node_modules/.bin/vitest run lib/designTokens.test.ts -t "DE —" --run
