  <rect x="24" y="96" width="752" height="300" fill="#f4f6f8" rx="8"/>
  <text x="40" y="128" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#111827">Komponenten (vorausgefüllt)</text>
  <rect x="40" y="152" width="220" height="104" fill="#ffffff" rx="4" stroke="#d1d5db" stroke-width="1"/>
