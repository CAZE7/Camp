  <text x="56" y="200" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#111827">200 Ah LiFePO4</text>
  <text x="56" y="220" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">90 % DoD</text>
